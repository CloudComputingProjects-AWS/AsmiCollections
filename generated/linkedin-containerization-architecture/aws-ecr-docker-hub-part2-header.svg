<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1600 870" role="img" aria-labelledby="title desc">
  <title id="title">AWS ECR vs Docker Hub - Part 2</title>
  <desc id="desc">LinkedIn article header continuing the Part 1 style, focused on architectural consistency for local Docker Compose, Amazon ECR, API Gateway throttling, and Postgres-backed state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#49627c"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#94a3b8" flood-opacity="0.28"/>
    </filter>
    <style>
      .left{fill:#e8f0fb}
      .mid{fill:#f5f7fb}
      .right{fill:#fff3df}
      .circle{fill:#e2f3e8}
      .title{font:700 68px Arial, sans-serif;fill:#102033;letter-spacing:0}
      .subtitle{font:400 34px Arial, sans-serif;fill:#4b6178}
      .card{fill:#ffffff;stroke:#cfd8e3;stroke-width:2.5;rx:26;filter:url(#softShadow)}
      .cardTitle{font:700 29px Arial, sans-serif;fill:#213244}
      .cardText{font:400 25px Arial, sans-serif;fill:#52677e}
      .arrow{stroke:#49627c;stroke-width:7;fill:none;marker-end:url(#arrow)}
      .pillDark{fill:#0f172a;rx:20}
      .pillBlue{fill:#16477d;rx:20}
      .pillText{font:700 31px Arial, sans-serif;fill:#ffffff}
      .footer{font:700 20px Arial, sans-serif;fill:#64748b}
    </style>
  </defs>

  <rect x="0" y="0" width="725" height="870" class="left"/>
  <rect x="725" y="0" width="255" height="870" class="mid"/>
  <rect x="980" y="0" width="620" height="485" class="right"/>
  <circle cx="1410" cy="735" r="360" class="circle"/>

  <text x="95" y="105" class="title">AWS ECR vs Docker Hub -Part2</text>
  <text x="98" y="163" class="subtitle">Fixing architectural inconsistency in containerized application delivery</text>

  <rect x="115" y="300" width="390" height="215" class="card"/>
  <text x="150" y="366" class="cardTitle">Local Development</text>
  <text x="150" y="425" class="cardText">Docker Compose</text>
  <text x="150" y="464" class="cardText">Postgres • API</text>

  <rect x="615" y="300" width="390" height="215" class="card"/>
  <text x="650" y="366" class="cardTitle">Cloud Deployment</text>
  <text x="650" y="425" class="cardText">Build • Tag • Push</text>
  <text x="650" y="464" class="cardText">AWS ECR • Lambda</text>

  <rect x="1115" y="300" width="390" height="215" class="card"/>
  <text x="1150" y="366" class="cardTitle">Runtime Governance</text>
  <text x="1150" y="425" class="cardText">API Gateway throttling</text>
  <text x="1150" y="464" class="cardText">Postgres FX cache</text>

  <path d="M525 407 H600" class="arrow"/>
  <path d="M1025 407 H1100" class="arrow"/>

  <rect x="75" y="630" width="690" height="115" class="pillDark"/>
  <text x="110" y="683" class="pillText">AWS ECR: deployable Lambda</text>
  <text x="110" y="724" class="pillText">container image registry</text>

  <rect x="840" y="630" width="690" height="115" class="pillBlue"/>
  <text x="875" y="683" class="pillText">Docker Hub: local dependency</text>
  <text x="875" y="724" class="pillText">image source for Postgres</text>

  <text x="95" y="815" class="footer">CXO takeaway: registry choice is only one layer; consistency comes from aligning local runtime, cloud runtime, rate limiting, and state ownership.</text>
</svg>
