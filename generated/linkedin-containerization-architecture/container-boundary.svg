<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Docker Hub and Amazon ECR roles in this application</title>
  <desc id="desc">Diagram showing Docker Hub as the source of local official Postgres image, local API image built from backend Dockerfile, and Amazon ECR as the registry for the AWS Lambda backend image.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 42px Arial, sans-serif;fill:#0f172a}
      .sub{font:400 22px Arial, sans-serif;fill:#475569}
      .lane{fill:#ffffff;stroke:#d7dee8;stroke-width:2;rx:20;filter:url(#shadow)}
      .node{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:16}
      .label{font:700 24px Arial, sans-serif;fill:#0f172a}
      .text{font:400 18px Arial, sans-serif;fill:#475569}
      .note{font:700 16px Arial, sans-serif;fill:#075985}
      .line{stroke:#334155;stroke-width:3.5;fill:none;marker-end:url(#arrow)}
      .chip{fill:#e0f2fe;rx:16}
      .chiptext{font:700 14px Arial, sans-serif;fill:#075985}
      .aws{fill:#ff9900}
      .docker{fill:#2496ed}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text x="70" y="85" class="title">Why Docker Hub Still Exists Beside Amazon ECR</text>
  <text x="70" y="124" class="sub">They solve different problems: Docker Hub supplies base/service images for local development; ECR stores the deployable AWS Lambda image.</text>

  <rect x="70" y="190" width="700" height="650" class="lane"/>
  <rect x="110" y="225" width="120" height="34" class="chip"/>
  <text x="130" y="247" class="chiptext">LOCAL</text>
  <text x="110" y="302" class="label">Docker Compose workspace</text>
  <text x="110" y="338" class="text">Runs the application stack on a developer machine.</text>

  <rect x="135" y="405" width="245" height="135" class="node"/>
  <circle cx="174" cy="445" r="23" class="docker"/>
  <text x="210" y="453" class="label">Docker Hub</text>
  <text x="160" y="494" class="text">postgres:16-alpine</text>
  <text x="160" y="522" class="text">official Postgres image</text>

  <rect x="470" y="405" width="245" height="135" class="node"/>
  <text x="500" y="453" class="label">Local API Image</text>
  <text x="500" y="494" class="text">built from</text>
  <text x="500" y="522" class="text">backend/Dockerfile</text>

  <rect x="300" y="625" width="245" height="135" class="node"/>
  <text x="330" y="673" class="label">Local Runtime</text>
  <text x="330" y="714" class="text">postgres + api</text>
  <text x="330" y="742" class="text">localhost:8000</text>

  <path class="line" d="M380 472 H460"/>
  <path class="line" d="M588 540 C575 590 540 615 500 635"/>
  <path class="line" d="M258 540 C275 590 315 615 355 635"/>

  <rect x="830" y="190" width="700" height="650" class="lane"/>
  <rect x="870" y="225" width="120" height="34" class="chip"/>
  <text x="892" y="247" class="chiptext">AWS DEV</text>
  <text x="870" y="302" class="label">Container deployment boundary</text>
  <text x="870" y="338" class="text">Build once in CI, push to ECR, update Lambda by image URI.</text>

  <rect x="900" y="405" width="245" height="135" class="node"/>
  <text x="930" y="453" class="label">GitHub Actions</text>
  <text x="930" y="494" class="text">docker build -f</text>
  <text x="930" y="522" class="text">Dockerfile.lambda</text>

  <rect x="1230" y="405" width="245" height="135" class="node"/>
  <path class="aws" d="M1270 435h70v58h-70z"/>
  <text x="1360" y="453" class="label">Amazon ECR</text>
  <text x="1260" y="522" class="text">image tagged by Git SHA</text>

  <rect x="1065" y="625" width="245" height="135" class="node"/>
  <text x="1095" y="673" class="label">AWS Lambda</text>
  <text x="1095" y="714" class="text">PackageType: Image</text>
  <text x="1095" y="742" class="text">FastAPI via Mangum</text>

  <path class="line" d="M1145 472 H1220"/>
  <path class="line" d="M1352 540 C1335 590 1295 615 1255 635"/>

  <text x="110" y="900" class="note">Fact from repo: docker-compose.yml pulls Postgres from Docker Hub and builds the local API image from backend/Dockerfile.</text>
  <text x="870" y="900" class="note">Fact from repo: deploy-dev-v3.yml builds backend/Dockerfile.lambda, pushes the SHA tag to ECR, and updates Lambda.</text>
</svg>
