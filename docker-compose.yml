
services:
  postgres:
    image: postgres:16-alpine
    container_name: apparel_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apparel_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apparel_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/apparel_portal
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@postgres:5432/apparel_portal  
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      
volumes:
  pgdata:
